<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>LogiTrack Driver</title>

<link rel="stylesheet" href="css/app.css">

</head>

<body>

<div class="container">

<header>

<div class="logo">

<img src="images/MIS logo.png" alt="Middleton International School">

</div>

<h1>LogiTrack</h1>

<p>
Kitchen Logistics Delivery
</p>

</header>


<div class="card">

<h2>Driver Login</h2>

<div class="field">

<label>

Driver Type

</label>

<select id="driverType">

<option value="Permanent">
Permanent Driver
</option>

<option value="Contractor">
Contractor Driver
</option>

</select>

</div>


<div class="field">

<label>

Driver Name

</label>

<select id="driver">

<option>

Loading...

</option>

</select>

</div>


<div id="contractorFields"
style="display:none;">

<div class="field">

<label>

Contractor Name

</label>

<input
id="contractorName"
type="text">

</div>

<div class="field">

<label>

Company

</label>

<input
id="company"
type="text">

</div>

<div class="field">

<label>

Vehicle Plate

</label>

<input
id="vehiclePlate"
type="text">

</div>

</div>


<button id="loginBtn">

Start Delivery

</button>

</div>


<footer>

Version Alpha 1.0

</footer>

</div>

<script src="js/state.js"></script>
<script src="js/auth.js"></script>
<script src="js/sharepoint.js"></script>
<script src="js/app.js"></script>

</body>

</html>
