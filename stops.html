<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/ldp-parcel-favicon.svg">
    
<title>Delivery Stops</title>

<link rel="stylesheet" href="css/app.css">

</head>

<body>

<div class="container">

<header>

<div class="logo">

🚚

</div>

<h1>Today's Deliveries</h1>

<p id="driverName">

Loading...

</p>

</header>

<div class="card">

<h2>

<span id="tripNumber"></span>

</h2>

<div class="progress">

<div class="progress-text">

Completed

<span id="progressText">

0 / 0

</span>

</div>

<div class="progress-bar">

<div
id="progressFill"
class="progress-fill">

</div>

</div>

</div>

</div>


<div
id="stopsContainer">

</div>


<footer>

Version Alpha 1.0

</footer>

</div>


<script src="js/state.js"></script>
<script src="js/auth.js"></script>
<script src="js/sharepoint.js"></script>

<script>

document.addEventListener("DOMContentLoaded", async ()=>{

if(!AppState.driver.name){

window.location.href="index.html";

return;

}

document.getElementById("driverName")

.innerHTML=

AppState.driver.name;

document.getElementById("tripNumber")

.innerHTML=

AppState.route.trip;


/* ----------------------------------
Load Stops
-----------------------------------*/

const stops = await SharePoint.getStops(
    AppState.route.routeId,
    AppState.route.trip
);

console.log("Downloaded Stops");
console.log(stops);

// NEW
const completed = await SharePoint.getCompletedStops(
    AppState.serviceDate,
    AppState.driver.id,
    AppState.route.routeId,
    AppState.route.trip
);

console.log("Completed Stops");
console.log(completed);

// Build array of completed StopIDs
const completedIds = completed.map(x => String(x.StopID));

// Total number of stops before filtering
const totalStops = stops.body.length;

// Remove completed stops
const remainingStops = stops.body.filter(
    stop => !completedIds.includes(String(stop.StopID))
);

// Update state correctly
AppState.deliveries.remaining = remainingStops;
AppState.deliveries.total = totalStops;
AppState.deliveries.completed = completed.length;

saveState();

renderStops();
    
});


function renderStops(){

const container=

document.getElementById("stopsContainer");

container.innerHTML="";

const total=

AppState.deliveries.total;

const completed=

AppState.deliveries.completed;

document.getElementById("progressText")

.innerHTML=

completed+

" / "+

total;

document.getElementById("progressFill")

.style.width=

progressPercent()+"%";


AppState.deliveries.remaining.forEach(stop=>{

const card=

document.createElement("div");

card.className="stop-card";

card.innerHTML=`

<h3>${stop.CentreName}</h3>

<p>${stop.Address}</p>

<p>

Receiver :

${stop.Receiver}

</p>

<button
onclick="openStop('${stop.StopID}')">

Open Delivery

</button>

`;

container.appendChild(card);

});

// NEW
renderAdditionalDeliveryCard(container);

}

function renderAdditionalDeliveryCard(container){

const card=document.createElement("div");

card.className="additional-card";

card.innerHTML=`

<div class="additional-header">

ADDITIONAL DELIVERY 

</div>

<div class="additional-body">

Only for ad-hoc or revisit deliveries.

</div>

<button id="additionalDeliveryBtn">

CONTINUE

</button>

`;

container.appendChild(card);

document

.getElementById("additionalDeliveryBtn")

.addEventListener("click",()=>{

window.location.href = "additionaldelivery.html";

});

}
    
function openStop(locationId){

const stop = AppState.deliveries.remaining.find(

    s => String(s.StopID) === String(locationId)

);

setCurrentStop(stop);

window.location.href="delivery.html";

}

</script>

</body>

</html>
