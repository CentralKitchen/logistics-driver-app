<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1.0">

<title>Additional Delivery</title>

<link rel="stylesheet" href="css/app.css">

</head>

<body>

<div class="page">

<h2 class="page-title">

Additional Delivery

</h2>

<p class="page-subtitle">

What would you like to do?

</p>

<div class="option-card">

<div class="option-icon">

📦

</div>

<h3>

New Ad-hoc Delivery

</h3>

<p>

Submit a delivery that was not originally assigned.

</p>

<button
id="adhocBtn">

CONTINUE

</button>

</div>

<div class="option-card">

<div class="option-icon">

🔄

</div>

<h3>

Revisit Completed Delivery

</h3>

<p>

Submit an additional delivery proof for a completed stop.

</p>

<button
id="revisitBtn">

CONTINUE

</button>

</div>

<button
class="secondary-btn"
onclick="history.back()">

← Back

</button>

<script src="additionaldelivery.js"></script>

</body>

</html>
