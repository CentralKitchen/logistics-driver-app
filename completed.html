<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delivery Completed</title>

<link rel="stylesheet" href="css/app.css">

<style>

.complete-card{

margin-top:80px;

background:white;

padding:30px;

border-radius:16px;

text-align:center;

box-shadow:0 4px 10px rgba(0,0,0,.08);

}

.complete-card h1{

font-size:30px;

margin-bottom:15px;

color:#1B5E20;

}

.complete-card p{

font-size:18px;

line-height:1.8;

}

.countdown{

margin-top:30px;

font-weight:bold;

font-size:18px;

color:#1976D2;

}

</style>

</head>

<body>

<div class="container">

<div class="complete-card">

<h1>🎉 All Deliveries Completed!</h1>

<p>

Thank you for completing today's deliveries.

</p>

<p>

Please drive safely and have a wonderful day ahead.

🚚💨

</p>

<div class="countdown">

Returning to Main Page in

<span id="timer">5</span>

seconds...

</div>

</div>

</div>

<script>

let seconds=5;

const timer=document.getElementById("timer");

const interval=setInterval(()=>{

seconds--;

timer.innerHTML=seconds;

if(seconds<=0){

clearInterval(interval);

window.location.href="index.html";

}

},1000);

</script>

</body>

</html>
