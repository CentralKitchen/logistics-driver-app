<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="images/ldp-parcel-favicon.svg">

<title>Delivery</title>

<link rel="stylesheet" href="css/app.css">

</head>

<body>

<div class="container">

<header>

<div class="logo">🚚</div>

<h1>Today's Delivery</h1>

</header>

<!-- Centre Information -->

<div class="card">

<h2 id="centreName">

Loading...

</h2>

<p id="deliveryAddress"></p>

<p id="deliveryUnit"></p>

<p id="deliveryPostal"></p>

</div>

<!-- Receiver -->

<div class="card">

<h3>👤 Receiver</h3>

<p id="receiverName"></p>

<p id="receiverContact"></p>

</div>

<!-- Photo -->

<div class="card">

<h3>📸 Delivery Proof</h3>

<button id="photoBtn">

Take Delivery Photo

</button>

<img
id="photoPreview"
style="
width:100%;
margin-top:15px;
border-radius:12px;
display:none;
">

<p
id="photoStatus"
style="
margin-top:12px;
text-align:center;
color:#777;
">

No photo captured.

</p>

</div>

<!--
=====================================================
GPS Verification
Dormant for Alpha Version
Will be enabled in Version 1.2
=====================================================

<div class="card">

<h3>📍 GPS Verification</h3>

<p id="gpsStatus">

❌ Not Verified

</p>

<button id="gpsBtn">

Verify GPS

</button>

</div>

-->

<!-- Complete Delivery -->

<button id="completeBtn">

✅ COMPLETE DELIVERY

</button>

<footer>

Version Alpha 1.0

</footer>

</div>

<script src="js/state.js"></script>
<script src="js/auth.js"></script>
<script src="js/sharepoint.js"></script>
<script src="js/delivery.js"></script>

<input
id="photoInput"
type="file"
accept="image/*"
capture="environment"
style="display:none;">  

</body>

</html>
