<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Delivery</title>

<link rel="stylesheet" href="css/app.css">

</head>

<body>

<div class="container">

<header>

<div class="logo">🚚</div>

<h1>Delivery Stop</h1>

</header>

<!-- Centre -->

<div class="card">

<h2 id="centreName">

Loading...

</h2>

<p id="deliveryAddress"></p>

<p id="deliveryUnit"></p>

<p id="deliveryPostal"></p>

</div>

<!-- Receiver -->

<div class="card">

<h3>👤 Receiver</h3>

<p id="receiverName"></p>

<p id="receiverContact"></p>

</div>

<!-- Delivery -->

<div class="card">

<h3>📦 Delivery</h3>

<div id="boxList">

No box information

</div>

</div>

<!-- Photo -->

<div class="card">

<h3>📸 Delivery Photo</h3>

<button id="photoBtn">

Take Photo

</button>

<p id="photoStatus">

No photo captured.

</p>

</div>

<!-- GPS -->

<div class="card">

<h3>📍 GPS Verification</h3>

<p id="gpsStatus">

❌ Not Verified

</p>

<button id="gpsBtn">

Verify GPS

</button>

</div>

<!-- Complete -->

<button id="completeBtn">

✅ COMPLETE DELIVERY

</button>

<footer>

Version Alpha 1.0

</footer>

</div>

<script src="js/state.js"></script>
<script src="js/delivery.js"></script>

</body>

</html>
