<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Select Trip - LogiTrack</title>

<link rel="stylesheet" href="css/app.css">

</head>

<body>

<div class="container">

<header>

<div class="logo">🚚</div>

<h1>LogiTrack</h1>

<p>Select Delivery Trip</p>

</header>

<div class="card">

<h2 id="welcomeText">
Welcome
</h2>

<p id="driverInfo" style="margin-bottom:25px;color:#666;">
Loading...
</p>

<div class="field">

<label>Select Trip</label>

<select id="tripSelect">

<option value="1">Trip 1</option>

<option value="2">Trip 2</option>

</select>

</div>

<button id="startTripBtn">

Start Trip

</button>

</div>

<footer>

Version Alpha 1.0

</footer>

</div>

<script src="js/state.js"></script>

<script>

document.addEventListener("DOMContentLoaded",()=>{

if(!AppState.driver.name){

alert("No driver logged in.");

window.location.href="index.html";

return;

}

document.getElementById("welcomeText").innerHTML=

"Welcome, " + AppState.driver.name;

document.getElementById("driverInfo").innerHTML=

"Driver Type : " +

AppState.driver.type;

});

document.getElementById("startTripBtn")

.addEventListener("click",()=>{

const trip=

document.getElementById("tripSelect").value;

setRoute({

trip:Number(trip)

});

window.location.href="stops.html";

});

</script>

</body>

</html>
